# Ubuntu/Linux deployment behind the host's existing HTTPS Nginx.
# First run: ./scripts/configure-prod.sh chat.example.com owner@example.com
# Launch: docker compose --env-file .env.prod -f compose-prod.yml up -d --build --wait
name: msgnr-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: msgnr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure-prod.sh first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Msgnr}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:?Set INITIAL_OWNER_EMAIL}
      INITIAL_OWNER_NAME: ${INITIAL_OWNER_NAME:-Administrator}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:?Set INITIAL_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./migrations/schema.sql
        target: /opt/msgnr/schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./etc/prod/initdb.sql
        target: /docker-entrypoint-initdb.d/001-msgnr.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP readiness waits for initdb; workspace confirms bootstrap committed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d msgnr && psql -U postgres -d msgnr -Atqc 'SELECT 1 FROM workspace LIMIT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging

  minio:
    # Maintained MinIO-compatible fork; includes its mcli administration client.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
      MC_CONFIG_DIR: /tmp/mcli
    volumes:
      - miniodata:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  storage-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    entrypoint: ["/bin/sh", "/opt/msgnr/init-storage.sh"]
    environment:
      MC_HOST_storage: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      MC_CONFIG_DIR: /tmp/mcli
      MINIO_BUCKET: ${MINIO_BUCKET:-task-attachments}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - type: bind
        source: ./etc/prod/init-storage.sh
        target: /opt/msgnr/init-storage.sh
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *logging

  redis:
    image: redis:8.2-alpine
    user: redis
    command: ["sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      # LiveKit uses the Linux host network and connects through loopback.
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: .
    environment:
      ENV: production
      PORT: "8080"
      METRICS_PORT: "9090"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${APP_DOMAIN:?Set APP_DOMAIN}}
      DATABASE_URL: postgres://msgnr:${APP_DB_PASSWORD}@postgres:5432/msgnr?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-35s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-task-attachments}
      ATTACHMENT_MAX_SIZE_MB: ${ATTACHMENT_MAX_SIZE_MB:-50}
      AVATAR_MAX_SIZE_MB: ${AVATAR_MAX_SIZE_MB:-5}
      LIVEKIT_URL: wss://${APP_DOMAIN:?Set APP_DOMAIN}/lk
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:${INITIAL_OWNER_EMAIL}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-9090}:8080"
      - "127.0.0.1:${METRICS_HOST_PORT:-9190}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  web:
    # Package the prebuilt web/web_client.tar.gz; never compile frontend sources here.
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=128m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.10
    user: "10001:10001"
    # Linux host networking keeps WebRTC media ports free of Docker NAT.
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        logging:
          level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${LIVEKIT_NODE_IP:-}"
        redis:
          address: 127.0.0.1:${REDIS_HOST_PORT:-16379}
          password: "${REDIS_PASSWORD}"
        keys:
          ${LIVEKIT_API_KEY}: "${LIVEKIT_API_SECRET}"
        webhook:
          api_key: "${LIVEKIT_API_KEY}"
          urls:
            - http://127.0.0.1:${BACKEND_HOST_PORT:-9090}/api/livekit/webhook
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  miniodata:
  redisdata:
